<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Tilt+Neon&family=Sacramento&family=Dancing+Script:wght@700&family=Pacifico&family=Satisfy&family=Comfortaa:wght@700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <!-- JWPlayer -->
    <script src="https://cdn.jwplayer.com/libraries/KB5zFt7A.js"></script>
    <title>Danh sách VOD</title>
    <script>
        // Handle GitHub Pages SPA redirect
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
</head>
<body class="bg-zinc-900 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
</body>
</html>
